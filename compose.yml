services:
  vintage-story:
    image: 'quartzar/vintage-story-server:latest'
    container_name: vs-server
    restart: unless-stopped
    ports:
      - '42420:42420/tcp'
      - '42420:42420/udp'
    volumes:
      - ./data:/srv/gameserver/data/vs
    environment:
      - VS_WHITELIST_ENABLED=false # INOP?
      - TZ=Europe/London  # Set to your timezone
      - VERSION=1.22.2   # Game version - works with release candidates (unstable) as well as regular releases (stable)
    stdin_open: true
    tty: true
